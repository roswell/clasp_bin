name: build
on:
  workflow_dispatch:
    inputs:
      version:
        description: clasp release to build
        default: '3.0.1'
      ref:
        description: clasp commit to build instead of the release tarball
        default: ''
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86-64, os: ubuntu-latest}
          - {arch: arm64, os: ubuntu-24.04-arm}
    env:
      VERSION: ${{ github.event.inputs.version }}
      REF: ${{ github.event.inputs.ref }}
      FILE: clasp-${{ github.event.inputs.version }}-${{ matrix.arch }}-linux-binary.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: image
        run: docker build -t clasp-build tools-for-build/glibc2.31
      - name: build
        run: docker run --rm -v $PWD:/w -w /w -e VERSION -e REF -e JOBS=4 clasp-build sh /w/build.sh
      - name: test
        run: |
          for image in ubuntu:20.04 debian:11-slim debian:trixie-slim fedora:42; do
            docker run --rm -v $PWD:/w:ro $image sh /w/test.sh /w/$FILE
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
      - name: upload
        if: ${{ github.repository == 'roswell/clasp_bin' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $VERSION || gh release create $VERSION --title $VERSION --notes ""
          gh release upload $VERSION $FILE --clobber
